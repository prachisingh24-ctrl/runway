name: Finance quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finance-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Finance engine and repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: corepack yarn install --no-lockfile
      - name: Type-check finance engine
        run: corepack yarn typecheck
      - name: Run finance regression tests
        run: corepack yarn test:finance
      - name: Build application when the Zite workspace is available
        run: |
          if [ -d .zite ] && [ -d ../../packages/components ]; then
            corepack yarn build
          else
            echo "::warning::Full app build skipped: this repository checkout does not include Zite-generated .zite files or the shared @project/components workspace. Run the full build in the Zite environment; this job does not certify the complete UI build."
          fi
